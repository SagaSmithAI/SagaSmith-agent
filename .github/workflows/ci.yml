name: Test Suite

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON('["ubuntu-latest","windows-latest"]') }}
        # CI concentrates on newer runtimes (3.11/3.12 still supported per pyproject requires-python).
        python-version: ${{ fromJSON('["3.13","3.14"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          prune-cache: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g; s|http://archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libolm-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check nanobot --select F

      - name: Run tests
        run: uv run python -m pytest tests/ --cov=nanobot --cov-report=term-missing:skip-covered

  real-domain-conformance:
    name: real domains (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [release-lock, latest-main]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          prune-cache: true

      - name: Install Agent conformance dependencies
        run: uv sync --frozen --extra dev

      - name: Materialize exact release lock
        if: matrix.lane == 'release-lock'
        run: >-
          uv run nanobot sagasmith install
          --source release
          --release-manifest "$GITHUB_WORKSPACE/sagasmith-stack-lock.json"
          --profile multi-system
          --transport streamable-http
          --skip-ui
          --state-root "$RUNNER_TEMP/sagasmith-real-domains/${{ matrix.lane }}"
          --config "$RUNNER_TEMP/sagasmith-real-domains/${{ matrix.lane }}/config.json"
          --json

      - name: Materialize latest domain mains
        if: matrix.lane == 'latest-main'
        run: >-
          uv run nanobot sagasmith install
          --source release
          --release-ref main
          --profile multi-system
          --transport streamable-http
          --skip-ui
          --state-root "$RUNNER_TEMP/sagasmith-real-domains/${{ matrix.lane }}"
          --config "$RUNNER_TEMP/sagasmith-real-domains/${{ matrix.lane }}/config.json"
          --json

      - name: Verify selected Narrative revision over Streamable HTTP
        run: >-
          uv run nanobot sagasmith benchmark
          --mode narrative
          --iterations 1
          --timeout 60
          --state-root "$RUNNER_TEMP/sagasmith-real-domains/${{ matrix.lane }}"
          --json

      - name: Start all three Streamable HTTP MCPs
        run: >-
          uv run nanobot sagasmith start
          --state-root "$RUNNER_TEMP/sagasmith-real-domains/${{ matrix.lane }}"
          --config "$RUNNER_TEMP/sagasmith-real-domains/${{ matrix.lane }}/config.json"
          --json

      - name: Verify all three Streamable HTTP MCPs
        run: >-
          uv run nanobot sagasmith doctor
          --profile multi-system
          --transport streamable-http
          --state-root "$RUNNER_TEMP/sagasmith-real-domains/${{ matrix.lane }}"
          --json

      - name: Run all 42 signed-host/domain/transport combinations
        env:
          SAGASMITH_REAL_DOMAINS_REQUIRED: "1"
          SAGASMITH_REAL_DOMAIN_LANE: ${{ matrix.lane }}
          SAGASMITH_REAL_DOMAIN_STATE_ROOT: ${{ runner.temp }}/sagasmith-real-domains/${{ matrix.lane }}
          SAGASMITH_REAL_DOMAIN_WORKSPACE: ${{ runner.temp }}/sagasmith-real-domains/${{ matrix.lane }}/releases/current
        run: uv run python -m pytest -q tests/host_conformance/test_real_domains.py

      - name: Stop Streamable HTTP MCPs
        if: always()
        run: >-
          uv run nanobot sagasmith stop
          --state-root "$RUNNER_TEMP/sagasmith-real-domains/${{ matrix.lane }}"
          --json

  local-kit-startup:
    name: Local Kit startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          prune-cache: true

      - name: Install Agent runtime
        run: uv sync --frozen

      - name: Copy mutable startup fixture into runner temp
        env:
          SOURCE_CONFIG: ${{ github.workspace }}/tests/fixtures/sagasmith-local-startup.json
          TARGET_CONFIG: ${{ runner.temp }}/sagasmith-local-startup/config.json
        run: >-
          uv run python -c
          "import os, shutil; from pathlib import Path;
          target = Path(os.environ['TARGET_CONFIG']); target.parent.mkdir(parents=True, exist_ok=True);
          shutil.copyfile(os.environ['SOURCE_CONFIG'], target)"

      - name: Materialize locked Narrative profile
        run: >-
          uv run nanobot sagasmith install
          --source release
          --release-manifest "${{ github.workspace }}/sagasmith-stack-lock.json"
          --profile narrative-only
          --transport streamable-http
          --skip-ui
          --state-root "${{ runner.temp }}/sagasmith-local-startup"
          --config "${{ runner.temp }}/sagasmith-local-startup/config.json"
          --json

      - name: Start the Local Kit
        run: >-
          uv run nanobot sagasmith start
          --state-root "${{ runner.temp }}/sagasmith-local-startup"
          --config "${{ runner.temp }}/sagasmith-local-startup/config.json"
          --json

      - name: Verify the running Local Kit
        run: >-
          uv run nanobot sagasmith doctor
          --mode narrative
          --transport streamable-http
          --state-root "${{ runner.temp }}/sagasmith-local-startup"
          --json

      - name: Stop the Local Kit
        if: always()
        run: >-
          uv run nanobot sagasmith stop
          --state-root "${{ runner.temp }}/sagasmith-local-startup"
          --json

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install WebUI dependencies
        working-directory: webui
        run: bun install

      - name: Lint WebUI
        working-directory: webui
        run: bun run lint

      - name: Test WebUI
        working-directory: webui
        run: bun run test

      - name: Build WebUI
        working-directory: webui
        run: bun run build

  distribution-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          prune-cache: true

      - name: Build and verify wheel contents
        env:
          NANOBOT_SKIP_WEBUI_BUILD: "1"
        run: |
          uv build --wheel
          python scripts/verify_wheel.py dist

      - name: Verify installed Hosted wheel boundary and entrypoint
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv venv .wheel-venv --python 3.12
          uv pip install --python .wheel-venv/bin/python "${wheel}[hosted]"
          .wheel-venv/bin/python -m nanobot.apps.hosted_audit --prune
          .wheel-venv/bin/python -m nanobot.apps.hosted_audit
          .wheel-venv/bin/sagasmith-agent-worker --help

      - name: Build Local Agent image
        run: docker build --tag sagasmith-agent-local:ci .

      - name: Verify Local distribution label
        run: >-
          test "$(docker inspect --format '{{ index .Config.Labels "org.sagasmith.distribution" }}'
          sagasmith-agent-local:ci)" = "local-agent"

      - name: Build Hosted Worker image
        run: docker build --file Dockerfile.hosted --tag sagasmith-agent-worker:ci .

      - name: Verify Hosted image boundary and entrypoint
        run: |
          docker run --rm --entrypoint python sagasmith-agent-worker:ci -m nanobot.apps.hosted_audit
          docker run --rm sagasmith-agent-worker:ci --help
