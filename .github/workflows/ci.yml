name: Test Suite

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON('["ubuntu-latest","windows-latest"]') }}
        # CI concentrates on newer runtimes (3.11/3.12 still supported per pyproject requires-python).
        python-version: ${{ fromJSON('["3.13","3.14"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          prune-cache: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g; s|http://archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libolm-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check nanobot --select F

      - name: Run tests
        run: uv run python -m pytest tests/ --cov=nanobot --cov-report=term-missing:skip-covered

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install WebUI dependencies
        working-directory: webui
        run: bun install

      - name: Lint WebUI
        working-directory: webui
        run: bun run lint

      - name: Test WebUI
        working-directory: webui
        run: bun run test

      - name: Build WebUI
        working-directory: webui
        run: bun run build

  distribution-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          prune-cache: true

      - name: Build and verify wheel contents
        env:
          NANOBOT_SKIP_WEBUI_BUILD: "1"
        run: |
          uv build --wheel
          python scripts/verify_wheel.py dist

      - name: Verify installed Hosted wheel boundary and entrypoint
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv venv .wheel-venv --python 3.12
          uv pip install --python .wheel-venv/bin/python "${wheel}[hosted]"
          .wheel-venv/bin/python -m nanobot.apps.hosted_audit --prune
          .wheel-venv/bin/python -m nanobot.apps.hosted_audit
          .wheel-venv/bin/sagasmith-agent-worker --help

      - name: Build Local Agent image
        run: docker build --tag sagasmith-agent-local:ci .

      - name: Verify Local distribution label
        run: >-
          test "$(docker inspect --format '{{ index .Config.Labels "org.sagasmith.distribution" }}'
          sagasmith-agent-local:ci)" = "local-agent"

      - name: Build Hosted Worker image
        run: docker build --file Dockerfile.hosted --tag sagasmith-agent-worker:ci .

      - name: Verify Hosted image boundary and entrypoint
        run: |
          docker run --rm --entrypoint python sagasmith-agent-worker:ci -m nanobot.apps.hosted_audit
          docker run --rm sagasmith-agent-worker:ci --help
